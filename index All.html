<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HCIS Dashboard Hub — HCaja | Anteraja</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#00428D; --magenta:#E91E8C; --orange:#F4600C;
    --ink:#111827; --muted:#7A8AA3; --line:#E5E7EB; --paper:#FFFFFF; --bg:#F5F7FB;
  }
  *{ box-sizing:border-box; }
  html, body{ margin:0; padding:0; height:100%; background:var(--bg); font-family:'Inter',sans-serif; color:var(--ink); }
  #app{ display:flex; flex-direction:column; height:100vh; }

  /* ---------- Header ---------- */
  header{
    background:var(--paper); border-bottom:1px solid var(--line);
    padding:14px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    box-shadow:0 1px 3px rgba(17,24,39,0.04);
  }
  header .logo{ height:30px; width:auto; flex-shrink:0; }
  header .titles{ margin-right:auto; }
  header .titles h1{ margin:0; font-size:15px; font-weight:700; color:var(--ink); }
  header .titles p{ margin:1px 0 0; font-size:11px; color:var(--muted); }
  header .badge{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600;
    color:#fff; background:linear-gradient(90deg,var(--navy),var(--magenta));
    padding:4px 10px; border-radius:20px; letter-spacing:0.3px;
  }

  /* ---------- Tabs ---------- */
  nav.tabbar{
    background:var(--paper); border-bottom:1px solid var(--line);
    display:flex; gap:4px; padding:0 20px; overflow-x:auto;
  }
  nav.tabbar button{
    appearance:none; border:none; background:none; cursor:pointer;
    font-family:'Inter',sans-serif; font-size:13px; font-weight:600; color:var(--muted);
    padding:12px 16px; border-bottom:3px solid transparent; white-space:nowrap;
    display:flex; align-items:center; gap:8px; transition:color .15s, border-color .15s;
  }
  nav.tabbar button svg{ width:15px; height:15px; flex-shrink:0; }
  nav.tabbar button:hover{ color:var(--ink); }
  nav.tabbar button.active{ color:var(--navy); border-bottom-color:var(--magenta); }
  nav.tabbar button .dot{
    width:6px; height:6px; border-radius:50%; background:var(--orange); display:none;
  }

  /* ---------- Content ---------- */
  .content{ flex:1; position:relative; min-height:0; }
  .pane{
    position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .12s;
  }
  .pane.active{ opacity:1; pointer-events:auto; }
  .pane iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }

  .loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:#fff; font-size:12.5px; color:var(--muted);
  }
  .spinner{
    width:26px; height:26px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--magenta);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media(min-width:768px){
    header{ padding:14px 32px; }
    nav.tabbar{ padding:0 32px; }
  }
</style>
</head>

<script>
  var loadedTabs = { leave: true, issue: false };

  function hideLoading(id){
    var el = document.getElementById(id);
    if(el) el.style.display = 'none';
  }
  document.getElementById('frame-leave').addEventListener('load', function(){ hideLoading('loading-leave'); });
  document.getElementById('frame-issue').addEventListener('load', function(){ hideLoading('loading-issue'); });

  document.getElementById('tabbar').addEventListener('click', function(e){
    var btn = e.target.closest('.tab-btn');
    if(!btn) return;
    var target = btn.getAttribute('data-target');

    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    btn.classList.add('active');

    document.querySelectorAll('.pane').forEach(function(p){ p.classList.remove('active'); });
    document.getElementById('pane-' + target).classList.add('active');

    // Lazy-load the issue dashboard's iframe only on first visit
    if(target === 'issue' && !loadedTabs.issue){
      document.getElementById('frame-issue').src = 'issue_sum.html';
      loadedTabs.issue = true;
    }
  });
</script>
